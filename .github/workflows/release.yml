name: Release

# Builds the portable ZIP when a release is published in the GitHub UI, and can be run
# by hand from the Actions tab (that run only uploads an artifact, no release is touched).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the SDK the 0.1.x builds were made with: a different SDK ships a different
      # WindowsDesktop runtime pack, so the native DLLs next to the exe would change too.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203

      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'release') { $env:GITHUB_REF_NAME } else { 'v0.0.0-dev' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=" + ($tag -replace '^v','') >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish HideyNotes.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:Version=${{ steps.v.outputs.version }} `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }

      # The archive has to mirror the local release exactly: the exe plus the five native
      # libraries, at the root of the zip, without the pdb. Anything else fails the build
      # instead of shipping a package that crashes on a machine without the .NET runtime.
      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -File | Where-Object { $_.Extension -ne '.pdb' })
          if (-not ($files.Name -contains 'HideyNotes.exe')) { throw 'HideyNotes.exe is missing from publish' }
          if ($files.Name -match '\.pdb$')                { throw 'a pdb leaked into the archive' }
          if ($files.Count -ne 6)                         { throw "unexpected file count: $($files.Count)" }

          $zip = "HideyNotes-${{ steps.v.outputs.version }}-win-x64.zip"
          Compress-Archive -Path $files.FullName -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding utf8

          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-ChildItem $zip, SHA256SUMS.txt | Format-Table Name, Length -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: HideyNotes-${{ steps.v.outputs.version }}
          path: |
            HideyNotes-*.zip
            SHA256SUMS.txt

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME "${{ steps.pkg.outputs.zip }}" SHA256SUMS.txt --clobber
          gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
